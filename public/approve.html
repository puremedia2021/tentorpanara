<meta charset="utf-8">
<title>Acc Sesi - Payroll Tentor</title>
<link rel="stylesheet" href="/style.css">
<h1>Konfirmasi Sesi Belajar</h1>
<div id="content">Memuat...</div>

<script>
const rupiah = (n) => "Rp " + Number(n).toLocaleString("id-ID");
const params = new URLSearchParams(location.search);
const tok = params.get("token");
const content = document.getElementById("content");

async function load() {
  if (!tok) {
    content.innerHTML = `<p class="msg error">Link tidak valid (token kosong).</p>`;
    return;
  }
  const res = await fetch(`/api/acc/${tok}`);
  const data = await res.json();
  if (!res.ok) {
    content.innerHTML = `<p class="msg error">${data.error}</p>`;
    return;
  }

  const roleLabel = data.role === "tentor" ? "Tentor" : "Siswa";
  const alreadyApproved = data.status === "approved";

  content.innerHTML = `
    <p>Anda login sebagai: <b>${roleLabel}</b></p>
    <table>
      <tr><th>Tentor</th><td>${data.tentor_nama}</td></tr>
      <tr><th>Siswa</th><td>${data.siswa_nama}</td></tr>
      <tr><th>Tempat</th><td>${data.tempat}</td></tr>
      <tr><th>Jumlah Peserta</th><td>${data.jumlah_peserta}</td></tr>
      <tr><th>Harga</th><td>${rupiah(data.harga)}</td></tr>
      <tr><th>Total</th><td>${rupiah(data.total)}</td></tr>
      <tr><th>Keterangan</th><td>${data.keterangan || "-"}</td></tr>
      <tr><th>Status</th><td><span class="badge ${data.status}">${data.status}</span></td></tr>
    </table>
    ${alreadyApproved ? `<p class="msg ok">Sesi ini sudah Anda acc.</p>` : `
      <form id="form-acc">
        <label>Upload Foto Bukti (wajah saat belajar)</label>
        <input type="file" name="foto" accept="image/*" capture="user" required>
        <button type="submit">Acc Sesi Ini</button>
        <p class="msg" id="msg-acc"></p>
      </form>
    `}
  `;

  const form = document.getElementById("form-acc");
  if (form) {
    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const msg = document.getElementById("msg-acc");
      const file = form.querySelector('input[name="foto"]').files[0];
      if (!file) return;

      msg.textContent = "Memproses foto...";
      msg.className = "msg";

      let fotoDataUrl;
      try {
        fotoDataUrl = await compressImage(file);
      } catch {
        msg.textContent = "Gagal memproses foto, coba foto lain";
        msg.className = "msg error";
        return;
      }

      const res = await fetch(`/api/acc/${tok}`, {
        method: "POST",
        headers: { "content-type": "application/json" },
        body: JSON.stringify({ foto: fotoDataUrl }),
      });
      const result = await res.json();
      if (!res.ok) {
        msg.textContent = result.error || "Gagal mengirim acc";
        msg.className = "msg error";
        return;
      }
      msg.textContent = "Berhasil acc. Terima kasih.";
      msg.className = "msg ok";
      form.querySelector("button").disabled = true;
    });
  }
}

function compressImage(file, maxSize = 480, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      let { width, height } = img;
      if (width > height && width > maxSize) {
        height = Math.round((height * maxSize) / width);
        width = maxSize;
      } else if (height > maxSize) {
        width = Math.round((width * maxSize) / height);
        height = maxSize;
      }
      const canvas = document.createElement("canvas");
      canvas.width = width;
      canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      resolve(canvas.toDataURL("image/jpeg", quality));
      URL.revokeObjectURL(img.src);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

load();
</script>
