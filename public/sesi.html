<meta charset="utf-8">
<title>Input Sesi - Payroll Tentor</title>
<link rel="stylesheet" href="/style.css">
<nav id="nav"></nav>
<h1>Input Sesi Belajar</h1>
<form id="form-sesi">
  <label>Tentor</label>
  <select name="tentor_id" id="select-tentor" required></select>
  <label>Siswa</label>
  <select name="siswa_id" id="select-siswa" required></select>
  <label>Tempat</label>
  <input name="tempat" required placeholder="mis. Rumah siswa, Kantor cabang A">
  <label>Jumlah Peserta</label>
  <input name="jumlah_peserta" type="number" min="1" value="1" required>
  <label>Keterangan</label>
  <textarea name="keterangan" rows="2"></textarea>
  <button type="submit">Simpan Sesi</button>
  <p class="msg" id="msg-sesi"></p>
</form>

<h2>Daftar Sesi Pending</h2>
<table id="tbl-sesi">
  <thead><tr><th>Tentor</th><th>Siswa</th><th>Tempat</th><th>Total</th><th>Status Tentor</th><th>Status Siswa</th></tr></thead>
  <tbody></tbody>
</table>

<script src="/nav.js"></script>
<script>
async function loadOptions() {
  const [tentor, siswa] = await Promise.all([
    fetch("/api/tentor").then(r => r.json()),
    fetch("/api/siswa").then(r => r.json()),
  ]);
  document.getElementById("select-tentor").innerHTML =
    tentor.map(t => `<option value="${t.id}">${t.nama}</option>`).join("");
  document.getElementById("select-siswa").innerHTML =
    siswa.map(s => `<option value="${s.id}">${s.nama} (${s.paket_nama}, sisa kuota ${s.sisa_sesi})</option>`).join("");
}

async function loadSesi() {
  const res = await fetch("/api/sesi?status=pending");
  const data = await res.json();
  document.querySelector("#tbl-sesi tbody").innerHTML = data.map(s => `
    <tr>
      <td>${s.tentor_nama}</td>
      <td>${s.siswa_nama}</td>
      <td>${s.tempat}</td>
      <td>${rupiah(s.total)}</td>
      <td><span class="badge ${s.status_tentor}">${s.status_tentor}</span></td>
      <td><span class="badge ${s.status_siswa}">${s.status_siswa}</span></td>
    </tr>
  `).join("");
}

document.getElementById("form-sesi").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = document.getElementById("msg-sesi");
  msg.textContent = "";
  msg.className = "msg";
  const fd = new FormData(e.target);
  const body = Object.fromEntries(fd.entries());
  const res = await fetch("/api/sesi", {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await res.json();
  if (!res.ok) {
    msg.textContent = data.error || "Gagal menyimpan";
    msg.className = "msg error";
    return;
  }
  msg.textContent = `Sesi tersimpan. Total: ${rupiah(data.total)}. Tentor & siswa bisa acc lewat dashboard masing-masing setelah login.`;
  msg.className = "msg ok";
  e.target.reset();
  loadOptions();
  loadSesi();
});

(async () => {
  const me = await requireAuth(["tim"]);
  if (!me) return;
  initNav();
  loadOptions();
  loadSesi();
})();
</script>
